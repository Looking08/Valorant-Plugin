<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>无畏契约插件 · 帮助</title>
  <link rel="stylesheet" href="{{@res}}css/base.css">
  <style>
    .head {
      display: flex; align-items: center; gap: 18px;
      padding: 22px 26px; border-radius: 16px; margin-bottom: 8px;
      border: 1px solid var(--line);
      background: linear-gradient(120deg, rgba(255,70,85,0.18), rgba(255,255,255,0.02));
    }
    .cmd-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 22px; }
    .cmd {
      display: flex; align-items: baseline; gap: 10px;
      padding: 9px 12px; border-radius: 10px;
      background: rgba(255,255,255,0.02); border: 1px solid var(--line);
    }
    .cmd b { color: var(--accent); font-weight: 800; white-space: nowrap; }
    .cmd .args { color: var(--gold); font-size: 13px; white-space: nowrap; }
    .cmd .desc { color: var(--text-dim); font-size: 13px; text-align: right; }
    .sec { margin-top: 22px; }
  </style>
</head>
<body>
<div id="container">

  <div class="head">
    <div class="grow">
      <div class="player-name" style="font-size:30px">无畏契约插件</div>
      <div class="small mute" style="margin-top:4px">数据面板 · 战绩查询 · 枪械熟练度 · 一人一份登录态 —— 指令一览</div>
    </div>
    <div class="badge">#瓦帮助</div>
  </div>

  {{each sections s}}
  <div class="sec">
    <div class="section-title">{{s.icon}} / {{s.title}} <small>{{s.desc}}</small></div>
    <div class="cmd-grid">
      {{each s.items item}}
      <div class="cmd">
        <b>{{item.cmd}}</b>
        {{if item.args}}<span class="args">{{item.args}}</span>{{/if}}
        <span class="desc grow">{{item.desc}}</span>
      </div>
      {{/each}}
    </div>
  </div>
  {{/each}}

  <div class="foot">
    <span>数据来自你部署的战绩网关 + valorant-api.com</span>
    <span>生成于 {{updatedAt}}</span>
  </div>
</div>
</body>
</html>
