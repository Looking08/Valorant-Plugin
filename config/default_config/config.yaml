# 无畏契约插件 · 配置说明
#
# ⚠️ 这是**模板文件**，改它没用（插件升级会被覆盖）。
# 要改请改同级目录下的 config/config.yaml —— 那边缺的键会自动从这边补，
# 你手写的注释和值不会被吃掉。改完**不用重启**，几秒内热更新。

# ---------------- 战绩网关 ----------------
# 插件本身**不含**任何抓包得来的登录态或第三方 key —— 玩家数据全部由你自己
# 部署的网关提供。起示例网关：在本插件目录执行 `pnpm bridge`。
gateway:
  # 网关地址，末尾不要带斜杠
  url: 'http://127.0.0.1:7820'
  # 与网关 service.yaml / 环境变量 TOKEN 一致
  token: 'change-me'
  # 单次请求超时（毫秒）
  timeout: 20000

# ---------------- 静态游戏数据 ----------------
# 特工 / 地图 / 武器的中文名与图标，来自 valorant-api.com（免费无 key）
static:
  url: 'https://valorant-api.com'
  # zh-CN / zh-TW / en-US …
  language: 'zh-CN'
  # 网络不通时的代理前缀（原 URL 会拼到它后面），不填即直连
  proxy: ''
  timeout: 20000
  # 缓存有效期（秒），默认 12 小时
  ttl: 43200

# ---------------- 展示 ----------------
display:
  # 一次最多能拉多少战绩（对群刷屏的保护）
  matchesMax: 30
  matchesDefault: 10
  weaponsMax: 40
  weaponsDefault: 20
  # 面板里展示 top 几个常用特工
  agentsDefault: 5
  # 是否把远程图标落到本地缓存（建议开着，出图快很多）
  assetCache: true

# ---------------- 指令 ----------------
command:
  prefix: '#瓦'
  # 额外别名，例如加一个 '#无畏契约'
  alias: []

# ---------------- 扫码登录 ----------------
# 扫码本身由网关完成（见 bridge/login/），插件只负责出二维码、盯着状态、
# 把结果告诉你。所以这里只需要几个「交互」参数。
login:
  # 默认扫码方式：qq / wx
  #   qq —— 走 QQ 互联 ptlogin2，不需要任何配置，但腾讯风控较严
  #   wx —— 走微信开放平台 qrconnect，需要网关侧配 WX_APPID / WX_REDIRECT
  type: 'qq'
  # 出码后帮你自动盯多少秒（0 = 不自动盯，只能手动发 #瓦登录状态）
  # 二维码本身约 120 秒失效，150 秒足够覆盖
  pollSeconds: 150
  # 每隔几秒问一次网关
  pollInterval: 2
  # 登录成功后自动把拿到的账号绑到当前用户名下（省得再发一次 #瓦绑定）
  autoBind: true
